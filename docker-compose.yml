x-podman:
  in_pod: false

services:
  tuton-agent:
    build: .
    container_name: tuton-agent
    restart: unless-stopped

    env_file:
      - .env

    expose:
      - "5000"

    volumes:
      - ./.env:/app/.env
      - ./moodle_credentials.json:/app/moodle_credentials.json
      - ./output:/app/output
      - ./.easyocr:/root/.easyocr
      - ./frontend:/app/frontend
      - /home/ubuntu/.config/opencode:/root/.config/opencode:ro
      - /home/ubuntu/.local/share/opencode:/root/.local/share/opencode
      # opencode >= 2.0 dipaketkan sebagai `@opencode/cli` (bukan `opencode-ai`).
      # Kalau path ini tidak ada, podman gagal saat create container dengan
      # "statfs ...: no such file or directory" dan container tidak pernah jalan.
      - /usr/lib/node_modules/@opencode/cli:/usr/lib/node_modules/@opencode/cli:ro

    deploy:
      resources:
        limits:
          memory: 4G
          cpus: "2.0"
        reservations:
          memory: 512M

# JANGAN deklarasikan network di sini: podman 3.4 meng-ignore flag
# `--network=<name>:alias=...` yang dibuat podman-compose sehingga container
# gagal menempel di app-network. Hubungkan manual via podman network connect
# di script restart.sh setelah `up`.